services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - aos_dev_data:/app/data
      - aos_dev_memory:/app/app/memory/storage

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

volumes:
  aos_dev_data:
  aos_dev_memory:
